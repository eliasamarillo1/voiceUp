# Cada lunes busca en YouTube los mejores vídeos tutoriales de cada recurso vocal,
# guarda la lista en src/data/tutorialsAuto.json y vuelve a publicar la web.
# La clave de YouTube está guardada como secreto del repositorio (YOUTUBE_API_KEY):
# nunca aparece en el código ni en la web publicada.

name: Actualizar vídeos tutoriales

on:
  schedule:
    - cron: '0 6 * * 1' # lunes a las 6:00 UTC
  workflow_dispatch: # botón «Run workflow» para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: tutoriales
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Probar el algoritmo de elección
        run: node --test scripts/tutorials/update.test.mjs

      - name: Buscar y puntuar vídeos en YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/tutorials/update.mjs

      - name: Guardar la lista nueva
        id: guardar
        run: |
          if git diff --quiet -- src/data/tutorialsAuto.json; then
            echo "cambios=no" >> "$GITHUB_OUTPUT"
            echo "La lista no ha cambiado."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/tutorialsAuto.json
            git commit -m "Actualizar vídeos tutoriales desde YouTube"
            git push
            echo "cambios=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Construir la web
        if: steps.guardar.outputs.cambios == 'si'
        run: |
          npm ci
          EXPO_OFFLINE=1 CI=1 npm run build:pages

      - name: Publicar en GitHub Pages
        if: steps.guardar.outputs.cambios == 'si'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
